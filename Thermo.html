
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thermography Excel Converter</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f2f4f7;
  padding: 20px;
}
.container {
  max-width: 650px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 10px;
}
button {
  padding: 14px 25px;
  background: #168447;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
}
button:disabled {
  background: gray;
}
#status {
  margin-top: 15px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="container">
<h2>Infrared Thermography Report</h2>
<p>Honda Ramkhamhaeng</p>

<button id="downloadBtn" onclick="downloadExcel()">
Download Excel (.xlsx)
</button>

<div id="status">พร้อมสร้างไฟล์ Excel</div>
</div>

<script>

function downloadExcel() {

  const status = document.getElementById("status");
  const button = document.getElementById("downloadBtn");

  try {

    if (typeof XLSX === "undefined") {
      throw new Error("โหลด XLSX ไม่สำเร็จ กรุณาตรวจสอบ Internet");
    }

    button.disabled = true;
    status.textContent = "กำลังสร้างไฟล์ Excel...";

    // สร้างข้อมูลทั้งหมดใน Array เดียว
    const data = [

      ["INFRARED THERMOGRAPHY REPORT FOR HONDA RAMKHAMHAENG"],
      ["Thermal Image No.1"],
      [],
      ["THERMAL IMAGE", "", "", "VISIBLE IMAGE"],
      ["", "", "", ""],
      ["", "", "", ""],
      ["", "", "", ""],
      ["", "", "", ""],
      [],
      ["Location (Floor/Room)", "Devices", "Detail"],
      ["ทางเข้าโครงการ", "Drop Out Fuse", "From MEA"],
      [],
      ["IR INFORMATION", "VALUE"],
      ["Date of Creation", "24-Jun-26"],
      ["Object Information", "Value"],
      ["Emissivity", 0.65],
      ["Ambient Temp (°C)", 34.0],
      ["Position", "Temperature (°C)"],
      ["P1", 47.4],
      ["P2", 47.1],
      ["P3", 47.6],
      [],
      ["THERMOGRAPHIC SURVEY SUGGESTED ACTIONS BASED ON TEMPERATURE RISE"],
      [],
      ["Temperature Difference Between Similar Components under Similar Loading"],
      ["Position", "Temp (°C)", "Normal", "Abnormal", "Recommended Action"],
      ["P1 - P2", 0.3, "✓", "", "Normal"],
      ["P2 - P3", 0.5, "✓", "", "Normal"],
      ["P3 - P1", 0.2, "✓", "", "Normal"],
      [],
      ["Temperature Difference Between Component and Ambient Air Temperature"],
      ["Position", "Temp (°C)", "Normal", "Abnormal", "Recommended Action"],
      ["P1 - Amb.", 13.4, "✓", "", "Indicates probable deficiency; repairs as time permits"],
      ["P2 - Amb.", 13.1, "✓", "", "Indicates probable deficiency; repairs as time permits"],
      ["P3 - Amb.", 13.6, "✓", "", "Indicates probable deficiency; repairs as time permits"],
      [],
      ["Remark: ดูตามคำแนะนำหน้าที่ 4"]
    ];

    // สร้าง Workbook
    const wb = XLSX.utils.book_new();

    // สร้าง Worksheet เพียง 1 Sheet
    const ws = XLSX.utils.aoa_to_sheet(data);

    // กำหนดความกว้างคอลัมน์
    ws["!cols"] = [
      {wch: 32},
      {wch: 19},
      {wch: 18},
      {wch: 15},
      {wch: 55}
    ];

    // รวมช่องหัวรายงาน
    ws["!merges"] = [
      {s:{r:0,c:0},e:{r:0,c:4}},
      {s:{r:1,c:0},e:{r:1,c:4}},
      {s:{r:3,c:0},e:{r:3,c:1}},
      {s:{r:3,c:3},e:{r:3,c:4}},
      {s:{r:22,c:0},e:{r:22,c:4}},
      {s:{r:24,c:0},e:{r:24,c:4}},
      {s:{r:30,c:0},e:{r:30,c:4}},
      {s:{r:36,c:0},e:{r:36,c:4}}
    ];

    // ตั้งค่าความสูงแถว
    ws["!rows"] = data.map((_,i) => ({
      hpt: [0,1].includes(i) ? 25 :
           [3].includes(i) ? 23 :
           [4,5,6,7].includes(i) ? 20 : 21
    }));

    // ตั้งค่าหน้ากระดาษ
    ws["!pageSetup"] = {
      paperSize: 9,
      orientation: "portrait",
      fitToWidth: 1,
      fitToHeight: 1
    };

    ws["!printOptions"] = {
      horizontalCentered: true
    };

    ws["!margins"] = {
      left: 0.25,
      right: 0.25,
      top: 0.3,
      bottom: 0.3,
      header: 0.1,
      footer: 0.1
    };

    // กำหนดพื้นที่พิมพ์
    ws["!ref"] = "A1:E37";

    // เพิ่ม Worksheet เพียงครั้งเดียว
    XLSX.utils.book_append_sheet(wb, ws, "Thermography Report");

    // ตรวจสอบจำนวน Sheet
    if (wb.SheetNames.length !== 1) {
      throw new Error("Workbook มีจำนวน Sheet ไม่ถูกต้อง");
    }

    // สร้างไฟล์ Excel และดาวน์โหลด
    const output = XLSX.write(wb, {
      bookType: "xlsx",
      type: "array"
    });

    const blob = new Blob(
      [output],
      {
        type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
      }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "Thermography_Honda_One_Sheet.xlsx";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    setTimeout(() => {
      URL.revokeObjectURL(url);
      button.disabled = false;
      status.textContent =
        "สร้างไฟล์สำเร็จ: Thermography_Honda_One_Sheet.xlsx\nจำนวน Sheet: 1";
    }, 1000);

  } catch (error) {

    button.disabled = false;

    status.textContent =
      "ไม่สามารถสร้างไฟล์ได้:\n" + error.message;

    console.error(error);

  }

}

</script>
</body>
</html>
